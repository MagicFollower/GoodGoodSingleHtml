<!DOCTYPE html>
<!--
  tools/probe/verify2.html — 交互冒烟台（不属于交付体）
  跑法：msedge --headless=new --window-size=1440,1040 --virtual-time-budget=60000 --dump-dom <此文件>
  每项都记 pass/fail + 观测值，最后输出 SMOKE_JSON。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>verify2</title>
    <link rel="stylesheet" href="../../vendor/codemirror.min.css" />
    <link rel="stylesheet" href="../../css/app.css" />
    <script>
      window.__errs = []
      window.addEventListener('error', e => window.__errs.push(String(e.message)))
      window.addEventListener('unhandledrejection', e => window.__errs.push('rejection: ' + String(e.reason)))
      /* store 的 subscriber 用 try/catch 吞异常并 console.error，这里把它捞回来才能定位 */
      const ce = console.error
      console.error = function () {
        window.__errs.push('console.error: ' + Array.from(arguments).map(a => (a && a.message ? a.message + ' @ ' + String(a.stack).split('\n')[1] : String(a))).join(' '))
        return ce.apply(console, arguments)
      }
    </script>
  </head>
  <body>
    <main class="page">
      <section class="editor">
        <div class="toolbar" id="toolbar">
          <div data-slot="theme-dropdown"></div>
          <div data-slot="language-dropdown"></div>
          <div class="toolbar-second-row">
            <div class="setting-buttons">
              <div data-slot="background-select"></div>
              <div data-slot="settings"></div>
              <div data-slot="copy-menu"></div>
            </div>
            <div class="share-buttons"><div data-slot="export-menu"></div></div>
          </div>
        </div>
        <div class="canvas-area" id="canvas-area">
          <div class="drop-overlay" id="drop-overlay" hidden></div>
          <div class="export-container" id="export-container">
            <div class="container" id="canvas-container">
              <div class="window-controls" id="window-controls" hidden></div>
              <div class="CodeMirror__container" id="editor-host"></div>
              <div class="watermark-host" id="watermark-host"></div>
              <div class="container-bg">
                <div class="white eliminateOnRender"></div>
                <div class="alpha eliminateOnRender"></div>
                <div class="bg" id="canvas-bg"></div>
              </div>
              <div class="handler" id="width-handler" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="toast-host" id="toast-host"></div>

    <script src="../../vendor/codemirror.min.js"></script>
    <script src="../../vendor/addons.js"></script>
    <script src="../../vendor/modes.js"></script>
    <script src="../../vendor/custom-modes.js"></script>
    <script src="../../vendor/hljs.min.js"></script>
    <script src="../../vendor/hljs-languages.js"></script>
    <script src="../../vendor/dom-to-image.js"></script>
    <script src="../../data/settings.js"></script>
    <script src="../../data/themes.js"></script>
    <script src="../../data/languages.js"></script>
    <script src="../../data/presets.js"></script>
    <script src="../../data/svg.js"></script>
    <script src="../../js/util.js"></script>
    <script src="../../js/url.js"></script>
    <script src="../../js/state.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/invisibles.js"></script>
    <script src="../../js/editor.js"></script>
    <script src="../../js/render.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/ui/widgets.js"></script>
    <script src="../../js/ui/panels.js"></script>
    <script src="../../js/app.js"></script>

    <script>
      const R = { steps: [], errors: [] }
      const tick = (ms = 60) => new Promise(r => setTimeout(r, ms))
      let pre = null
      function flush() {
        if (!pre) {
          pre = document.createElement('pre')
          pre.id = 'smoke-json'
          document.body.appendChild(pre)
        }
        pre.textContent = 'SMOKE_JSON' + JSON.stringify(R, null, 1)
      }
      function step(name, pass, observed) {
        R.steps.push({ name, pass: !!pass, observed })
        flush()
      }
      /* 单步限时：dom-to-image 在无头下走真实异步，挂住也要保住已完成的判定 */
      const guard = (p, ms, label) => {
        let timer
        return Promise.race([
          Promise.resolve().then(() => (typeof p === 'function' ? p() : p)),
          new Promise((_, rej) => {
            timer = setTimeout(() => rej(new Error('HANG:' + label)), ms)
          }),
        ]).finally(() => clearTimeout(timer))
      }
      const click = el => {
        if (!el) throw new Error('目标不存在')
        el.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }))
        el.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }))
        el.click()
      }
      const q = s => document.querySelector(s)
      const qa = s => [...document.querySelectorAll(s)]

      async function run() {
        await tick(700)
        const store = CARBON.store

        /* 1 主题下拉：数量 + 选择生效 */
        const themeDisplay = q('[data-slot="theme-dropdown"] .dropdown-display')
        click(themeDisplay)
        await tick()
        const themeItems = qa('[data-slot="theme-dropdown"] .dropdown-list-item')
        step('主题下拉打开且含 Create+', themeItems.length === 30, { items: themeItems.length })
        const monokai = themeItems.find(li => li.textContent.indexOf('Monokai') === 0)
        click(monokai)
        await tick(120)
        step(
          '切到 Monokai 生效',
          store.state.theme === 'monokai' &&
            getComputedStyle(q('#editor-host .CodeMirror')).backgroundColor === 'rgb(39, 40, 34)',
          { theme: store.state.theme, bg: getComputedStyle(q('#editor-host .CodeMirror')).backgroundColor }
        )
        step('下拉选后自动关闭', q('[data-slot="theme-dropdown"] .dropdown-list').hidden, {})

        /* 2 语言下拉：数量 + 搜索过滤 + 选择写回 mime */
        click(q('[data-slot="language-dropdown"] .dropdown-display'))
        await tick()
        const langItems = qa('[data-slot="language-dropdown"] .dropdown-list-item')
        step('语言下拉列出 78 项', langItems.length === 78, { items: langItems.length })
        const langInput = q('[data-slot="language-dropdown"] .dropdown-display-text')
        langInput.value = 'py'
        langInput.dispatchEvent(new Event('input', { bubbles: true }))
        await tick()
        const filtered = qa('[data-slot="language-dropdown"] .dropdown-list-item').map(li => li.textContent)
        step('输入 py 能过滤', filtered.length > 0 && filtered.length < 10, filtered)
        langInput.value = ''
        langInput.dispatchEvent(new Event('input', { bubbles: true }))
        await tick()
        const rust = qa('[data-slot="language-dropdown"] .dropdown-list-item').find(li => /^Rust$/.test(li.textContent.trim()))
        click(rust)
        await tick(120)
        step('选 Rust 写回 mode', store.state.language === 'rust', { language: store.state.language })

        /* 3 背景取色器：拖 hue → backgroundColor 变 rgba */
        click(q('.bg-select-display'))
        await tick()
        const popOpen = !q('.bg-pickers').hidden
        const before = store.state.backgroundColor
        const hueBar = q('.bg-pickers .hue-bar')
        const rect = hueBar.getBoundingClientRect()
        const md = (x, y, target) =>
          (target || document).dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: x, clientY: y }))
        md(rect.left + rect.width * 0.25, rect.top + 6, hueBar)
        md(rect.left + rect.width * 0.25, rect.top + 6, hueBar)
        await tick(120)
        step('背景面板打开', popOpen, {})
        step(
          '拖 hue 改变 backgroundColor',
          store.state.backgroundColor !== before && /^rgba\(/.test(store.state.backgroundColor),
          { before, after: store.state.backgroundColor }
        )
        const presetSw = qa('.bg-pickers .preset-colors button')
        step('15 个预设色可点', presetSw.length === 15, { n: presetSw.length })
        click(presetSw[0])
        await tick(120)
        step('点预设色写入 rgba', store.state.backgroundColor === 'rgba(208,2,27,1)', { v: store.state.backgroundColor })
        const hexInput = q('.bg-pickers .color-fields input')
        hexInput.value = '#00ff00'
        hexInput.dispatchEvent(new Event('change', { bubbles: true }))
        await tick(120)
        step('手输 hex 生效', store.state.backgroundColor === 'rgba(0,255,0,1)', { v: store.state.backgroundColor })

        /* 4 Settings 面板：三页签 + 滑杆 + 开关 + 数字输入 */
        click(q('[data-slot="settings"] .btn-square-icon'))
        await tick()
        const settingsPop = q('.settings-popout')
        step('设置面板打开', settingsPop && !settingsPop.hidden, {})
        step('预设块渲染 8 个内置预设', qa('.settings-presets .preset-container').length === 8, {
          n: qa('.settings-presets .preset-container').length,
        })
        const tabs = qa('.settings-menu .menu-button .btn')
        step('三页签存在', tabs.length === 3, tabs.map(t => t.textContent.trim()))
        click(tabs[0])
        await tick()
        step('窗口页签有 padding 滑杆', qa('.settings-pane .slider').length >= 3, { sliders: qa('.settings-pane .slider').length })
        const padV = qa('.settings-pane .slider input')[0]
        padV.value = '120'
        padV.dispatchEvent(new Event('input', { bubbles: true }))
        await tick(120)
        step('拖 padding(vert) 生效', store.state.paddingVertical === '120px', { v: store.state.paddingVertical })
        const wcT = qa('.settings-pane .toggle input')[0]
        click(wcT)
        await tick(120)
        step('关窗口控件后画布隐藏它', store.state.windowControls === false && q('#window-controls').hidden, {
          wc: store.state.windowControls,
        })
        const shadowT = qa('.settings-pane .toggle input')[1]
        click(shadowT)
        await tick(120)
        step('投影开关联动', store.state.dropShadow === false && q('#editor-host').style.boxShadow === 'none', {
          shadow: q('#editor-host').style.boxShadow,
        })
        const radios = qa('.window-theme-themes [role="radio"]')
        step('窗口主题四选一', radios.length === 4, radios.map(r => r.getAttribute('value')))
        click(radios[3])
        await tick(120)
        step('选 boxy 生效', store.state.windowTheme === 'boxy', { wt: store.state.windowTheme })
        click(tabs[1])
        await tick()
        const sizeSlider = qa('.settings-pane .slider input')[0]
        sizeSlider.value = '17'
        sizeSlider.dispatchEvent(new Event('input', { bubbles: true }))
        await tick(120)
        step('字号滑杆生效', store.state.fontSize === '17px', { fs: store.state.fontSize })
        const lnT = qa('.settings-pane .toggle input')[0]
        click(lnT)
        await tick(200)
        step('行号开关出 gutter', store.state.lineNumbers === true && qa('#editor-host .CodeMirror-linenumber').length > 3, {
          numbers: qa('#editor-host .CodeMirror-linenumber').length,
        })
        const hidT = qa('.settings-pane .toggle input')[1]
        click(hidT)
        await tick(250)
        step('隐形字符出标记', qa('#editor-host .cm-invisible').length > 10, { n: qa('#editor-host .cm-invisible').length })
        click(hidT)
        await tick(250)
        step('关掉隐形字符会清干净', qa('#editor-host .cm-invisible').length === 0, { n: qa('#editor-host .cm-invisible').length })
        click(tabs[2])
        await tick()
        step('其它页签有导入/导出/重置', qa('.settings-pane .btn').length >= 3, qa('.settings-pane .btn').map(b => b.textContent.trim()))

        /* 5 预设应用与撤销 */
        click(tabs[0])
        await tick()
        const presetBtns = qa('.settings-presets .preset-btn')
        const beforePreset = { t: store.state.theme, bg: store.state.backgroundColor }
        click(presetBtns[1])
        await tick(150)
        step(
          '应用预设改了设置',
          store.state.theme !== beforePreset.t || store.state.backgroundColor !== beforePreset.bg,
          { before: beforePreset, after: { t: store.state.theme, bg: store.state.backgroundColor }, preset: store.state.preset }
        )
        const applied = q('.settings-presets-applied')
        step('出现"已应用预设"条与撤销', applied && !applied.hidden, {})
        if (applied && !applied.hidden) {
          click(q('.settings-presets-applied button'))
          await tick(150)
          step('撤销回到应用前主题', store.state.theme === beforePreset.t, { t: store.state.theme })
        }

        /* 6 自定义主题 */
        click(q('[data-slot="theme-dropdown"] .dropdown-display'))
        await tick()
        const createItem = qa('[data-slot="theme-dropdown"] .dropdown-list-item').find(li => /Create/.test(li.textContent))
        click(createItem)
        await tick(150)
        const tc = q('.theme-create-popout')
        step('自建主题面板打开', tc && !tc.hidden, {})
        step('12 个 token 色位', qa('.theme-colors .field').length === 12, { n: qa('.theme-colors .field').length })
        const nameInput = q('.theme-settings .name-field input')
        nameInput.value = '审计测试主题'
        nameInput.dispatchEvent(new Event('input', { bubbles: true }))
        const firstKey = qa('.theme-colors .field button')[0]
        click(firstKey)
        await tick(120)
        step('选中 token 出取色器', !!q('.highlight-picker .color-picker'), {})
        const themesBefore = store.library.themes.length
        const createBtn = qa('.theme-settings .btn').find(b => /Create/.test(b.textContent))
        step('Create 按钮随名称解除 disabled', !!createBtn && !createBtn.disabled, {
          found: !!createBtn,
          disabled: createBtn ? createBtn.disabled : null,
        })
        click(createBtn)
        await tick(200)
        step(
          'Create+ 写入主题与 localStorage',
          store.library.themes.length === themesBefore + 1 && (localStorage.getItem('CARBON_THEMES') || '').indexOf('审计测试主题') >= 0,
          { themes: store.library.themes.length, stored: (localStorage.getItem('CARBON_THEMES') || '').length }
        )
        step('新主题成为当前主题', /^theme:/.test(store.state.theme), { theme: store.state.theme })

        /* 7 行号点击淡化（CM5 的 gutterEvent 按 clientX/clientY 命中测试，不看 event.target，
         * 所以合成事件必须带真实坐标，否则判据是假阴） */
        const gutter2 = qa('#editor-host .CodeMirror-linenumber')[1]
        let gx = null, gy = null
        if (gutter2) {
          const gr = gutter2.getBoundingClientRect()
          gx = Math.round(gr.left + gr.width / 2)
          gy = Math.round(gr.top + gr.height / 2)
          for (const type of ['mousedown', 'mouseup', 'click']) {
            gutter2.dispatchEvent(new MouseEvent(type, { bubbles: true, button: 0, clientX: gx, clientY: gy }))
          }
          await tick(200)
        }
        const gutterHost = document.querySelector('#editor-host .CodeMirror-gutters')
        step('点行号写入 selectedLines', (store.state.selectedLines || []).length === 1, {
          sl: store.state.selectedLines,
          at: gutter2 ? [gutter2.textContent, gx, gy] : null,
          gutterBoxRight: gutterHost ? Math.round(gutterHost.getBoundingClientRect().right) : null,
        })
        const dimmed = qa('#editor-host .CodeMirror-line').filter(l => l.style.opacity === '0.5').length
        step('非选中行被淡化', dimmed > 0, { dimmed })
        const vw = CARBON.editor.cm.display.view
        R.diag = {
          selectedLines: store.state.selectedLines,
          viewLen: vw.length,
          v0: vw[0] ? { cls: vw[0].text && vw[0].text.className, op: vw[0].text && vw[0].text.style.opacity, lineNo: vw[0].line && vw[0].line.lineNo() } : null,
          v1: vw[1] ? { cls: vw[1].text && vw[1].text.className, op: vw[1].text && vw[1].text.style.opacity, lineNo: vw[1].line && vw[1].line.lineNo() } : null,
          lineEls: qa('#editor-host .CodeMirror-line').length,
          ops: qa('#editor-host .CodeMirror-line').map(l => l.style.opacity || '-'),
        }
        flush()

        /* 8 导出菜单 */
        click(q('.export-pair .caret'))
        await tick()
        step('导出面板打开', !q('.export-popout').hidden, {})
        const sizeBtns = qa('.size-group .btn')
        step('倍率三挡', sizeBtns.length === 3, sizeBtns.map(b => b.textContent))
        click(sizeBtns[2])
        await tick(120)
        step('选 4x 生效', store.state.exportSize === '4x', { es: store.state.exportSize })
        const fname = q('.export-row input')
        fname.value = 'audit-shot'
        fname.dispatchEvent(new Event('input', { bubbles: true }))
        await tick(120)
        step('文件名写入 state', store.state.name === 'audit-shot', { name: store.state.name })

        /* 9 持久化 */
        await tick(900)
        const saved = JSON.parse(localStorage.getItem('CARBON_STATE') || '{}')
        step(
          'CARBON_STATE 落盘且不含 code/backgroundImage',
          Object.keys(saved).length > 10 && saved.code === undefined && saved.backgroundImage === undefined,
          { keys: Object.keys(saved).length, hasCode: 'code' in saved }
        )

        /* 10 导出真实字节（4x + 正方形） */
        try {
          const png = await guard(() => CARBON.exporter.getImage({ format: 'blob' }), 20000, 'png')
          step('4x 导出仍是合法 PNG', png.type === 'image/png' && png.size > 1000, { bytes: png.size })
        } catch (e) {
          step('4x 导出仍是合法 PNG', false, { error: String(e.message || e) })
        }
        try {
          const svg = await guard(() => CARBON.exporter.getImage({ format: 'svg' }), 20000, 'svg')
          const svgText = await guard(() => svg.text(), 10000, 'svg.text')
          step('SVG 含 foreignObject 且无 cursors', svgText.indexOf('foreignObject') >= 0 && svgText.indexOf('CodeMirror-cursors') < 0, {
            bytes: svg.size,
          })
        } catch (e) {
          step('SVG 含 foreignObject 且无 cursors', false, { error: String(e.message || e) })
        }

        R.errors = window.__errs
        R.errorsExpected = ['SecurityError'] // 剪贴板/下载类在无头下允许，不参与判定
        R.ok = R.steps.every(s => s.pass)
        R.counts = { total: R.steps.length, pass: R.steps.filter(s => s.pass).length }
      }

      window.addEventListener('load', () => {
        flush()
        run()
          .catch(e => {
            R.fatal = e && e.message ? e.message : String(e)
            R.stack = e && e.stack ? String(e.stack).split('\n').slice(0, 5).join(' | ') : null
          })
          .then(() => {
            R.errors = window.__errs
            R.errorsExpected = ['SecurityError']
            R.counts = { total: R.steps.length, pass: R.steps.filter(s => s.pass).length }
            flush()
          })
      })
    </script>
  </body>
</html>
