<!DOCTYPE html>
<!--
  tools/probe/verify3-font.html — 字体面定向探针（判据：切换到底有没有落到 CSS 上）
  跑法：msedge --headless=new --window-size=1440,1040 --virtual-time-budget=20000 --dump-dom <此文件>
  要区分两件不同的事：
    ① 接线：store.set({fontFamily}) 之后，画布上真的那段文字的 computed font-family 变不变；
    ② 可用性：变了之后渲染像素是否真的不同（本机没装这个字体就会"变了但看不出"）。
  所以既量 computed，也量同一段文本的实测宽度，并拿一个本机一定装了的可控字体当对照组。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>verify3 font</title>
    <link rel="stylesheet" href="../../vendor/codemirror.min.css" />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/fonts.css" />
  </head>
  <body>
    <main class="page">
      <section class="editor">
        <div class="toolbar" id="toolbar">
          <div data-slot="theme-dropdown"></div>
          <div data-slot="language-dropdown"></div>
          <div class="toolbar-second-row">
            <div class="setting-buttons">
              <div data-slot="background-select"></div>
              <div data-slot="settings"></div>
              <div data-slot="copy-menu"></div>
            </div>
            <div class="share-buttons"><div data-slot="export-menu"></div></div>
          </div>
        </div>
        <div class="canvas-area" id="canvas-area">
          <div class="drop-overlay" id="drop-overlay" hidden></div>
          <div class="export-container" id="export-container">
            <div class="container" id="canvas-container">
              <div class="window-controls" id="window-controls" hidden></div>
              <div class="CodeMirror__container" id="editor-host"></div>
              <div class="watermark-host" id="watermark-host"></div>
              <div class="container-bg">
                <div class="white eliminateOnRender"></div>
                <div class="alpha eliminateOnRender"></div>
                <div class="bg" id="canvas-bg"></div>
              </div>
              <div class="handler" id="width-handler" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="toast-host" id="toast-host"></div>

    <script src="../../vendor/codemirror.min.js"></script>
    <script src="../../vendor/addons.js"></script>
    <script src="../../vendor/modes.js"></script>
    <script src="../../vendor/custom-modes.js"></script>
    <script src="../../vendor/hljs.min.js"></script>
    <script src="../../vendor/hljs-languages.js"></script>
    <script src="../../vendor/dom-to-image.js"></script>
    <script src="../../data/settings.js"></script>
    <script src="../../data/themes.js"></script>
    <script src="../../data/languages.js"></script>
    <script src="../../data/presets.js"></script>
    <script src="../../data/svg.js"></script>
    <script src="../../data/fonts.js"></script>
    <script src="../../js/util.js"></script>
    <script src="../../js/url.js"></script>
    <script src="../../js/state.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/invisibles.js"></script>
    <script src="../../js/editor.js"></script>
    <script src="../../js/render.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/ui/widgets.js"></script>
    <script src="../../js/ui/panels.js"></script>
    <script src="../../js/app.js"></script>

    <script>
      const R = { fonts: [], notes: [] }
      const SAMPLE = 'const pluckDeep = key => obj =>'

      /* 字体是懒加载的：第一次用到才去取文件。不等它 load 完就量，量到的是回退字体的宽度，
       * 读数会假阴（实测 4 个族挤在同一个宽度）。所以先显式 load 再量。 */
      const BOGUS = 'NoSuchFontForProbe12345'
      const widthOf = fam => {
        const c = document.createElement('canvas')
        const x = c.getContext('2d')
        x.font = '14px "' + fam + '", ' + BOGUS
        return Math.round(x.measureText(SAMPLE).width * 100) / 100
      }

      async function run() {
        await new Promise(r => setTimeout(r, 700))
        const store = CARBON.store
        store.set({ code: SAMPLE, language: 'javascript' })
        await new Promise(r => setTimeout(r, 400))

        const lineEl = document.querySelector('#editor-host .CodeMirror-line')
        R.notes.push('画布里有 .CodeMirror-line = ' + !!lineEl)

        /* 基线：一个肯定不存在的族 → 浏览器必然回退，量到的就是"没换成"的样子 */
        let bogusWidth = null
        try {
          await document.fonts.load('14px "' + BOGUS + '"', SAMPLE)
          bogusWidth = widthOf(BOGUS)
        } catch (e) {
          R.notes.push('bogus 基线取失败: ' + e.message)
        }
        R.bogusWidth = bogusWidth

        for (const f of CARBON.FONTS) {
          try {
            await document.fonts.load('14px "' + f.id + '"', SAMPLE)
          } catch (e) {
            R.notes.push(f.id + ' fonts.load 抛错: ' + e.message)
          }
          store.set({ fontFamily: f.id })
          await new Promise(r => setTimeout(r, 120))
          const host = document.getElementById('editor-host')
          const cmEl = host.querySelector('.CodeMirror') || host
          const applied = getComputedStyle(cmEl).fontFamily
          const live = document.querySelector('#editor-host .CodeMirror-line')
          const lineApplied = live ? getComputedStyle(live).fontFamily : null
          /* 真判据：量这一段文字在页面上的实测宽度（Range 包住整行文本），
           * 不是拿 host 的字体栈去 canvas 里量——那只能证明"栈写对了"，证不了"字换了" */
          let textWidth = null
          if (live && live.firstChild) {
            const rg = document.createRange()
            rg.selectNodeContents(live)
            const rect = rg.getBoundingClientRect()
            textWidth = Math.round(rect.width * 100) / 100
          }
          /* 单族宽度（不给回退栈）：与 bogus 不同才说明这个族真的有自己的 face */
          const soloWidth = widthOf(f.id)
          R.fonts.push({
            id: f.id,
            stateWrote: store.state.fontFamily === f.id,
            stackOnHost: applied,
            stackOnLine: lineApplied,
            /* 行元素吃不吃宿主的字体：不吃的话就是中间有规则截断，属接线问题 */
            inheritsFromHost: lineApplied === applied,
            textWidth,
            soloWidth,
            resolvesToOwnFace: bogusWidth === null ? null : soloWidth !== bogusWidth,
            advancePx: Math.round((soloWidth / SAMPLE.length) * 1000) / 1000,
          })
        }

        /* 对照组：本机一定装了 Consolas（注册表实测 installed=True）。
         * 它和"装了但不在清单里"的字体走的是同一套 CSS 通路，用来证明接线本身是通的。 */
        store.set({ fontFamily: 'Consolas' })
        await new Promise(r => setTimeout(r, 90))
        const host = document.getElementById('editor-host')
        const cmEl = host.querySelector('.CodeMirror') || host
        R.control = {
          id: 'Consolas',
          note: '本机装了但不在 FONTS 白名单里，用来对照"装了就能量出自己的 face"这条通路',
          stackOnHost: getComputedStyle(cmEl).fontFamily,
          soloWidth: widthOf('Consolas'),
          resolvesToOwnFace: bogusWidth === null ? null : widthOf('Consolas') !== bogusWidth,
          stateWrote: store.state.fontFamily,
        }

        /* 汇总：判"每个族有没有自己的 face"要和 bogus 基线比宽度。
         * 不能只看"13 个族有几种宽度"——等宽字体里 advance 相同是合法的（0.6em 一族就有 4 个）。 */
        const widths = {}
        for (const x of R.fonts) widths[x.textWidth] = (widths[x.textWidth] || 0) + 1
        R.summary = {
          total: R.fonts.length,
          ownFaceCount: R.fonts.filter(x => x.resolvesToOwnFace === true).length,
          ownFaceMissing: R.fonts.filter(x => x.resolvesToOwnFace !== true).map(x => x.id),
          bogusWidth,
          distinctRenderedTextWidths: Object.keys(widths).length,
          textWidthHistogram: widths,
          /* 判"接线通不通"要比字体栈的第一个族名，别拿 id 去 indexOf——
           * 带空格的族名在栈里是带引号的，indexOf(id.replace(/ /g,'')) 永远不中（上一版就是这么假红的） */
          wiringOk: R.fonts.every(x => {
            const first = String(x.stackOnHost).split(',')[0].replace(/^["']|["']$/g, '').trim()
            return x.stateWrote && first === x.id
          }),
          lineInherits: R.fonts.every(x => x.inheritsFromHost),
        }
      }

      let pre = null
      function flush() {
        if (!pre) {
          pre = document.createElement('pre')
          document.body.appendChild(pre)
        }
        pre.textContent = 'FONT_JSON' + JSON.stringify(R, null, 1)
      }

      window.addEventListener('load', () => {
        flush()
        run()
          .catch(e => {
            R.fatal = e && e.message ? e.message : String(e)
          })
          .then(flush)
      })
    </script>
  </body>
</html>
