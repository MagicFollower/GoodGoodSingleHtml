<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>键盘按键测试 · 本地单文件版</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    --bg:#0c0f14; --panel:#141922; --line:#242c38; --txt:#cfd6e2; --dim:#7f8a9b;
    background:radial-gradient(1200px 600px at 50% -10%,#151b26 0%,var(--bg) 60%);
    color:var(--txt);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 30px}
  h1{font-size:17px;margin:0 0 3px;letter-spacing:.5px}
  .cap{color:var(--dim);font-size:12px;margin-bottom:14px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .seg{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.25;
  }
  .seg b{display:block;color:var(--txt);font-size:13px;font-weight:600}
  .seg i{display:block;font-style:normal;font-size:11px;opacity:.8}
  .seg:hover{border-color:#38506e;color:var(--txt)}
  .seg.on{border-color:#2f7d4f;background:#12291d;box-shadow:0 0 0 1px #2f7d4f33 inset}
  .seg.on b{color:#7ef0a8}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:stretch}
  @media (max-width:900px){.cards{grid-template-columns:1fr}}
  #stage{
    background:#10151d;border:1px solid var(--line);border-radius:12px;
    padding:14px;overflow:hidden;min-height:220px;
  }
  #kb{position:relative;margin:0 auto;--u:44px}
  .k{position:absolute;padding:2px}
  .cap2{
    width:100%;height:100%;border-radius:calc(var(--u)*.14);
    background:linear-gradient(180deg,#2c3441 0%,#222934 62%,#1b212a 100%);
    border:1px solid #39424f;
    box-shadow:0 2px 0 #12161c, 0 3px 6px #00000055;
    display:flex;align-items:flex-end;padding:calc(var(--u)*.11) calc(var(--u)*.13);
    font-size:calc(var(--u)*.245);color:#aab4c4;line-height:1;white-space:nowrap;
    overflow:hidden;transition:background .12s,border-color .12s,color .12s,box-shadow .08s,transform .06s;
  }
  .k.tall .cap2{align-items:center}
  .k.mod .cap2{color:#8f9bb0;font-size:calc(var(--u)*.21)}
  .k.nav .cap2,.k.num .cap2{color:#96a2b6;font-size:calc(var(--u)*.2)}
  .k.ok .cap2{background:linear-gradient(180deg,#18402a,#123021);border-color:#2f7d4f;color:#79e3a1}
  .k.down .cap2{
    background:linear-gradient(180deg,#ffb020,#f08a0c);border-color:#ffd479;color:#231303;
    box-shadow:0 0 0 1px #ffd479, 0 0 calc(var(--u)*.5) #ffa20f88, 0 1px 0 #7a4a00;
    transform:translateY(1px);
  }
  .k.ghost .cap2{border-style:dashed;border-color:#3a4453;color:#5b6676;background:#171d26;box-shadow:none}
  .k.miss .cap2{border-color:#a13b3b;color:#e07a7a}
  .k.knob .cap2{border-radius:50%;align-items:center;justify-content:center;padding:0;
    background:radial-gradient(circle at 38% 32%,#3b4553 0%,#252c38 55%,#171d26 100%);font-size:calc(var(--u)*.2)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:flex;flex-direction:column}
  .panel h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
  .prog{font-size:26px;font-weight:600;letter-spacing:.5px}
  .prog span{font-size:13px;color:var(--dim);font-weight:400}
  .track{height:8px;border-radius:5px;background:#1d2430;margin:9px 0 6px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#2f9d5c,#7ef0a8);transition:width .18s}
  .fill.done{background:linear-gradient(90deg,#f0a90c,#ffd479)}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:2px 0}
  .kv b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:#7ef0a8}
  .verdict{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#101720;border:1px solid var(--line);color:var(--dim)}
  .verdict.warn{border-color:#8a6a1f;background:#1f1a0e;color:#e8c56a}
  .verdict.bad{border-color:#7d3030;background:#1e1112;color:#eb8f8f}
  .log{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#93a1b5;flex:1 1 auto;min-height:132px;
        max-height:230px;overflow:auto;background:#0e131b;border:1px solid var(--line);border-radius:8px;padding:8px}
  .log div{white-space:pre;overflow:hidden;text-overflow:ellipsis}
  .log .u{color:#e07a7a}
  .btns{display:flex;gap:8px;margin-top:10px}
  button.act{flex:1;background:#1b2330;border:1px solid #33405222;color:var(--txt);padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
  button.act:hover{border-color:#3f566f;background:#212c3c}
  .note{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:8px}
  .note code{background:#0e131b;padding:1px 4px;border-radius:4px;color:#9fb3cc;font-size:11px}
  .fin{color:#ffd479;font-size:12px;margin-top:6px;display:none}
  .fin.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>键盘按键测试</h1>
  <div class="cap">直接按键盘即可，无需点击页面。按键按 <code style="font-size:11px">event.code</code> 物理键位识别，中文输入法下同样有效。</div>

  <div class="bar" id="layouts"></div>

  <div id="stage"><div id="kb"></div></div>

  <div class="cards">
    <div class="panel">
      <h2>测试进度</h2>
      <div class="prog" id="progTxt">0 / 0 <span>键</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="kv"><span>完成度</span><b id="pctTxt">0%</b></div>
      <div class="kv"><span>本次触发次数</span><b id="hits">0</b></div>
      <div class="fin" id="fin"></div>
    </div>

    <div class="panel">
      <h2>全键无冲 / 冲突检测</h2>
      <div class="big" id="simNow">0 <span style="font-size:13px;color:var(--dim);font-weight:400">键同时按下</span></div>
      <div class="kv"><span>会话峰值</span><b id="simPeak">0</b></div>
      <div class="kv"><span>阈值上限</span><b id="simCap">∞</b></div>
      <div class="verdict" id="verdict">按住几个键不松、再逐个叠加，观察计数是否会停住。</div>
      <div class="note">网页层只能观测「浏览器收到的 HID 事件」，不能证明键盘矩阵的电气无冲。计数卡在 <b>6</b> = 走的是 USB boot 协议（6 键无冲）；能超过 6 说明已进入非 boot 的多键报告。</div>
    </div>

    <div class="panel">
      <h2>按键日志</h2>
      <div class="log" id="log"><div style="color:#5b6676">等待按键…</div></div>
      <div class="btns">
        <button class="act" id="btnReset">重置本布局</button>
        <button class="act" id="btnAll">全部清零</button>
      </div>
      <div class="note" id="layoutNote"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================ 键位表（1U 坐标模型） ============================ */
const NUM = ['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'];
const QP  = ['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'];
const AS  = ['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'];
const ZX  = ['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash'];
const SYM = {Backquote:'`',Minus:'-',Equal:'=',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',
             BracketLeft:'[',BracketRight:']',Backslash:'\\',NumpadAdd:'+',NumpadSubtract:'-',
             NumpadMultiply:'×',NumpadDivide:'÷',NumpadDecimal:'.'};
const WNM = {Escape:'Esc',Backspace:'Bksp',Tab:'Tab',CapsLock:'Caps',Enter:'Enter',ShiftLeft:'Shift',ShiftRight:'Shift',
             ControlLeft:'Ctrl',ControlRight:'Ctrl',AltLeft:'Alt',AltRight:'Alt',MetaLeft:'Win',MetaRight:'Win',
             ContextMenu:'Menu',Space:'Space',PrintScreen:'PrtSc',ScrollLock:'ScrLk',Pause:'Pause',NumLock:'NumLk',
             NumpadEnter:'Enter',VolumeMute:'静音',VolumeDown:'音量-',VolumeUp:'音量+',MediaPlayPause:'播放/暂停'};
const lb = c => SYM[c] || WNM[c] || (/^Digit(\d)$/.exec(c) || [])[1] || (c.startsWith('Key') ? c.slice(3) : c);
const seq = (arr, kind) => arr.map(c => [c, lb(c), 1, kind || '']);

/* 行项目 = [codes, 标注, 宽U, 类别, 高U]；数字元素为占位/间隔（U） */
function rows(spec){
  const keys = [];
  for (const r of spec){
    let cx = r.x || 0;
    for (const it of r.k){
      if (typeof it === 'number'){ cx += it; continue; }
      const [codes, label, w = 1, kind = '', h = 1] = it;
      keys.push({ x: cx, y: r.y, w, h, kind, label, codes: String(codes).split(' ') });
      cx += w;
    }
  }
  return keys;
}

/* 主键区五排（ANSI），宽度可裁剪 */
function mainBlock(o){
  const bsW = o.bsW ?? 2, tabW = o.tabW ?? 1.5, bslW = o.bslW ?? 1.5,
        cpW = o.cpW ?? 1.75, enW = o.enW ?? 2.25, lsW = o.lsW ?? 2.25, rsW = o.rsW ?? 2.75;
  const R = [];
  R.push({ y: o.y, x: 0, k: (o.escTop
      ? [['Escape Backquote', o.escLabel || 'Esc/`', 1], ...seq(NUM.slice(1))]
      : [...seq(NUM)]).concat([['Backspace', 'Bksp', bsW, 'mod']]) });
  R.push({ y: o.y + 1, k: [['Tab','Tab',tabW,'mod'], ...seq(QP), ...seq(['BracketLeft','BracketRight']), ['Backslash','\\',bslW]] });
  R.push({ y: o.y + 2, k: [['CapsLock','Caps',cpW,'lock'], ...seq(AS), ['Enter','Enter',enW,'mod']] });
  R.push({ y: o.y + 3, k: [['ShiftLeft','Shift',lsW,'mod'], ...seq(ZX), ['ShiftRight','Shift',rsW,'mod']] });
  R.push({ y: o.y + 4, k: o.bottom });
  return R;
}
const BOT_FULL = () => ([['ControlLeft','Ctrl',1.25,'mod'],['MetaLeft Win','Win',1.25,'mod'],['AltLeft','Alt',1.25,'mod'],
                         ['Space','Space',6.25,'mod'],['AltRight','Alt',1.25,'mod'],['MetaRight','Win',1.25,'mod'],
                         ['ContextMenu','Menu',1.25,'mod'],['ControlRight','Ctrl',1.25,'mod']]);
const BOT_COMP = (fn) => ([['ControlLeft','Ctrl',1.25,'mod'],['MetaLeft','Win',1.25,'mod'],['AltLeft','Alt',1.25,'mod'],
                           ['Space','Space',6.25,'mod'],['AltRight','Alt',1.25,'mod'],
                           fn ? ['Fn','Fn',1.25,'ghost'] : ['MetaRight','Win',1.25,'mod'],
                           ['ContextMenu','Menu',1.25,'mod'],['ControlRight','Ctrl',1.25,'mod']]);
const FROW = (y) => ([{ y, k: [['Escape','Esc'],['F1','F1'],['F2','F2'],['F3','F3'],['F4','F4'],
                               0.5, ['F5','F5'],['F6','F6'],['F7','F7'],['F8','F8'],
                               0.5, ['F9','F9'],['F10','F10'],['F11','F11'],['F12','F12']] }]);
/* 编辑键区 + 方向键（3 列，x 基址 16） */
function navBlock(y0){
  return [
    { y: y0,   x: 16, k: [['PrintScreen','PrtSc',1,'nav'],['ScrollLock','ScrLk',1,'nav'],['Pause','Pause',1,'nav']] },
    { y: y0+1, x: 16, k: [['Insert','Ins',1,'nav'],['Home','Home',1,'nav'],['PageUp','PgUp',1,'nav']] },
    { y: y0+2, x: 16, k: [['Delete','Del',1,'nav'],['End','End',1,'nav'],['PageDown','PgDn',1,'nav']] },
    { y: y0+3, x: 16, k: [1, ['ArrowUp','↑',1,'nav']] },
    { y: y0+4, x: 16, k: [['ArrowLeft','←',1,'nav'],['ArrowDown','↓',1,'nav'],['ArrowRight','→',1,'nav']] }
  ];
}
/* 数字小键盘（4 列，x 基址 20；+ 与 Enter 各跨 2 排高，下一排用数字占位让位） */
function numpad(y0){
  return [
    { y: y0+1, x: 20, k: [['NumLock','NumLk',1,'num'],['NumpadDivide','÷',1,'num'],['NumpadMultiply','×',1,'num'],['NumpadSubtract','-',1,'num']] },
    { y: y0+2, x: 20, k: [['Numpad7','7'],['Numpad8','8'],['Numpad9','9'],['NumpadAdd','+',1,'num',2]] },
    { y: y0+3, x: 20, k: [['Numpad4','4'],['Numpad5','5'],['Numpad6','6'], 1 ] },
    { y: y0+4, x: 20, k: [['Numpad1','1'],['Numpad2','2'],['Numpad3','3'],['NumpadEnter','Enter',1,'num',2]] },
    { y: y0+5, x: 20, k: [['Numpad0','0',2,'num'],['NumpadDecimal','.',1,'num'], 1 ] }
  ];
}

const LAYOUTS = [
  { id:'108', name:'108 键', sub:'全尺寸 + 多媒体',
    note:'108 = 104 键全尺寸 + 顶部 4 多媒体键（音量/播放）。各家把多媒体键做成旋钮或独立排的情况都有，此处按独立按键登记。',
    spec: () => ([{ y:0, x:16, k:[['VolumeMute','静音',1,'media'],['VolumeDown','音量-',1,'media'],['VolumeUp','音量+',1,'media'],['MediaPlayPause','播放',1,'media']] }]
      .concat(FROW(1)).concat(mainBlock({y:2, bottom:BOT_FULL()})).concat(navBlock(1), numpad(1))) },

  { id:'104', name:'104 键', sub:'ANSI 全尺寸',
    note:'标准 ANSI 全尺寸：F 区 13 + 主键区 61 + 编辑区 9 + 方向键 4 + 数字区 17。',
    spec: () => (FROW(0).concat(mainBlock({y:1, bottom:BOT_FULL()})).concat(navBlock(0), numpad(0))) },

  { id:'87', name:'87 键', sub:'TKL 无数字区',
    note:'TKL：在 104 的基础上摘掉 17 键数字小键盘，其余不变。',
    spec: () => (FROW(0).concat(mainBlock({y:1, bottom:BOT_FULL()})).concat(navBlock(0))) },

  { id:'81', name:'81 键', sub:'75% + 旋钮',
    note:'按你这块 75% 实机登记：F 区 13 + 主键区 60（底排 Ctrl·Win·Alt·Space·Alt·Fn·Ctrl，无 Menu）+ 右列 Ins/Del/PgUp/PgDn + 倒 T 方向键（↑ 压在 ↓ 正上方）= 81。右上角旋钮不占键数，转动或按下若发出音量/播放键码会点亮它。',
    spec: () => ([
      ...FROW(0),
      { y:0, x:16.5, k:[['MediaPlayPause VolumeUp VolumeDown','旋钮',1,'knob']] },
      ...mainBlock({ y:1, lsW:2.25, rsW:2.75, bottom:([
        ['ControlLeft','Ctrl',1.25,'mod'],['MetaLeft','Win',1.25,'mod'],['AltLeft','Alt',1.25,'mod'],
        ['Space','Space',6.25,'mod'],['AltRight','Alt',1.25,'mod'],['Fn','Fn',1.25,'ghost'],
        ['ControlRight','Ctrl',1.25,'mod']]) }),
      { y:1, x:16.5, k:[['Insert','Ins',1,'nav']] },
      { y:2, x:16.5, k:[['Delete','Del',1,'nav']] },
      { y:3, x:16.5, k:[['PageUp','PgUp',1,'nav']] },
      { y:4, x:15.5, k:[['ArrowUp','↑',1,'nav'],['PageDown','PgDn',1,'nav']] },
      { y:5, x:14.5, k:[['ArrowLeft','←',1,'nav'],['ArrowDown','↓',1,'nav'],['ArrowRight','→',1,'nav']] }
    ]) },

  { id:'68', name:'68 键', sub:'65% / 60%+方向键',
    note:'68 = 61 键主体 + PrtSc/Ins/Del 右侧一列 + 4 独立方向键。65% 各家右列键位不一（有的是 Home/End/PgUp/PgDn），如与你板子不符请以实际标注为准。',
    spec: () => ([{ y:0, x:16.5, k:[['PrintScreen','PrtSc',1,'nav']] },
                  { y:1, x:16.5, k:[['Insert','Ins',1,'nav']] },
                  { y:2, x:16.5, k:[['Delete','Del',1,'nav']] },
                  { y:3, x:16.5, k:[['ArrowUp','↑',1,'nav']] },
                  { y:4, x:15.5, k:[['ArrowLeft','←',1,'nav'],['ArrowDown','↓',1,'nav'],['ArrowRight','→',1,'nav']] },
                  ...mainBlock({y:0, lsW:2.25, rsW:2.75, bottom:BOT_COMP(true)})]) },

  { id:'61', name:'61 键', sub:'60% 紧凑',
    note:'60%：无独立 F 区/方向键/编辑键，Esc 位常与 ` 复用（已同时登记两个 code）。方向键与 F 区走 Fn 层，浏览器收不到 Fn，无法在此检测。',
    spec: () => ([...mainBlock({y:0, escTop:true, lsW:1.25, rsW:1.75, bottom:BOT_COMP(true)})]) }
];

/* ============================ 状态 ============================ */
const $ = id => document.getElementById(id);
const state = { id: '104', keys: [], byCode: new Map(), store: {}, tested: new Map(), down: new Set(),
                hits: 0, peak: 0, unknown: new Map(), startedAt: 0 };

function compile(layout){
  const keys = rows(layout.spec());
  const byCode = new Map();
  keys.forEach((k, i) => {
    k.i = i;
    k.catchable = k.kind !== 'ghost';
    if (k.catchable) k.codes.forEach(c => { if (!byCode.has(c)) byCode.set(c, []); byCode.get(c).push(i); });
  });
  return { keys, byCode };
}

function setLayout(id){
  const layout = LAYOUTS.find(l => l.id === id);
  state.id = id;
  const { keys, byCode } = compile(layout);
  state.keys = keys; state.byCode = byCode;
  state.tested = state.store[id] || (state.store[id] = new Map());   // 每档各自记账，索引不跨布局
  state.down.clear();
  state.startedAt = 0;
  $('layoutNote').textContent = layout.note;
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  buildBoard();
  update();
}

/* ============================ 渲染 ============================ */
const kbEl = $('kb'), stageEl = $('stage');
let caps = [];
function buildBoard(){
  kbEl.textContent = '';
  caps = state.keys.map(k => {
    const d = document.createElement('div');
    d.className = 'k' + (k.kind ? ' ' + k.kind : '') + (k.h > 1 ? ' tall' : '');
    const c = document.createElement('div');
    c.className = 'cap2'; c.textContent = k.label;
    d.appendChild(c); kbEl.appendChild(d);
    k.el = d; return d;
  });
  layout();
}
function layout(){
  if (!state.keys.length) return;
  const W = Math.max(...state.keys.map(k => k.x + k.w));
  const H = Math.max(...state.keys.map(k => k.y + k.h));
  const avail = stageEl.clientWidth - 28;
  const u = Math.max(22, Math.min(46, avail / W, (window.innerHeight - 250) / H));
  kbEl.style.setProperty('--u', u + 'px');
  kbEl.style.width = (W * u) + 'px';
  kbEl.style.height = (H * u) + 'px';
  for (const k of state.keys){
    k.el.style.left = (k.x * u) + 'px';
    k.el.style.top = (k.y * u) + 'px';
    k.el.style.width = (k.w * u) + 'px';
    k.el.style.height = (k.h * u) + 'px';
  }
}
new ResizeObserver(layout).observe(stageEl);
window.addEventListener('resize', layout);

function update(){
  const press = new Set();
  for (const k of state.keys) if (k.catchable && k.codes.some(c => state.down.has(c))) press.add(k.i);
  for (const k of state.keys){
    const on = press.has(k.i), ok = state.tested.has(k.i);
    k.el.classList.toggle('down', on);
    k.el.classList.toggle('ok', ok && !on);
    if (k.kind === 'ghost' || !k.catchable) k.el.classList.add('ghost');
  }
  const keyEls = state.keys.filter(k => k.kind !== 'knob');   // 旋钮是编码器，不占键数
  const total = keyEls.length;
  const testable = keyEls.filter(k => k.catchable).length;
  const done = state.keys.reduce((n, k) => n + (state.tested.has(k.i) && k.kind !== 'knob' ? 1 : 0), 0);
  const pct = testable ? Math.min(100, done / testable * 100) : 0;
  $('progTxt').innerHTML = done + ' / ' + testable + ' <span>键</span>' +
      (total !== testable ? '<span>（本布局共 ' + total + ' 键，' + (total - testable) + ' 个 Fn 层键不可检测）</span>' : '');
  $('pctTxt').textContent = pct.toFixed(1) + '%';
  const fill = $('fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('done', pct >= 100);
  $('hits').textContent = state.hits;
  $('fin').classList.toggle('on', pct >= 100);
  $('fin').textContent = pct >= 100
    ? '可检测键位已全部触发 ✓（' + testable + ' 键，用时 ' + (state.startedAt ? ((Date.now()-state.startedAt)/1000).toFixed(1) + 's' : '-') + '）。'
    : '';

  const n = state.down.size;
  $('simNow').innerHTML = n + ' <span style="font-size:13px;color:var(--dim);font-weight:400">键同时按下</span>';
  $('simPeak').textContent = state.peak;
  const v = $('verdict');
  v.className = 'verdict';
  if (state.peak >= 14) { $('simCap').textContent = '未见上限'; v.textContent = '峰值 ' + state.peak + ' 键：报告已超出 boot 协议，键盘/接口在走多键无冲（NKRO）报告。'; }
  else if (state.peak > 6){ $('simCap').textContent = '>6'; v.textContent = '峰值 ' + state.peak + ' 键：突破了 boot 协议的 6 键上限。'; }
  else if (state.peak === 6){ $('simCap').textContent = '6'; v.classList.add('warn');
      v.textContent = '峰值停在 6：这是 USB HID boot 协议的典型上限（6KRO）。继续叠加按键若计数不再增长，即为 6 键无冲。'; }
  else if (state.peak > 0){ $('simCap').textContent = String(state.peak); v.classList.add('warn');
      v.textContent = '峰值仅 ' + state.peak + ' 键：请按住不松、逐个叠加到 6 键以上再判定。'; }
  else { $('simCap').textContent = '∞'; v.className = 'verdict';
      v.textContent = '按住几个键不松、再逐个叠加，观察计数是否会停住。'; }
}

/* ============================ 事件 ============================ */
function log(code, info, cls){
  const box = $('log');
  if (box.firstChild && box.firstChild.textContent.startsWith('等待')) box.textContent = '';
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = code.padEnd(16, ' ') + ' ' + info;
  box.appendChild(d);
  while (box.children.length > 40) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

window.addEventListener('keydown', e => {
  const code = e.code;
  if (!code || code === 'Unidentified') return;
  const hit = state.byCode.get(code);
  if (hit || code === 'Tab' || code === 'Space') e.preventDefault();   // 保住焦点/滚动/右键菜单
  if (!state.startedAt) state.startedAt = Date.now();
  const first = !state.down.has(code);
  state.down.add(code);
  if (!e.repeat || first){
    state.hits++;
    if (first || !e.repeat) log(code, hit ? '→ ' + state.keys[hit[0]].label : '(未登记)', hit ? '' : 'u');
  }
  if (hit){
    if (!e.repeat) hit.forEach(i => { if (!state.tested.has(i)) state.tested.set(i, { code, at: Date.now() }); });
  } else {
    state.unknown.set(code, (state.unknown.get(code) || 0) + 1);
  }
  if (state.down.size > state.peak) state.peak = state.down.size;
  update();
}, true);

window.addEventListener('keyup', e => { state.down.delete(e.code); update(); }, true);
window.addEventListener('blur', () => { if (state.down.size){ state.down.clear(); update(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden){ state.down.clear(); update(); } });
document.addEventListener('contextmenu', e => { if (e.target.closest('#kb')) e.preventDefault(); });

/* ============================ 布局切换 / 清零 ============================ */
$('layouts').innerHTML = LAYOUTS.map(l =>
  `<button class="seg" data-id="${l.id}"><b>${l.name}</b><i>${l.sub}</i></button>`).join('');
$('layouts').addEventListener('click', e => {
  const b = e.target.closest('.seg');
  if (b) setLayout(b.dataset.id);
});
$('btnReset').onclick = () => { state.store[state.id] = new Map(); state.tested = state.store[state.id];
                                state.down.clear(); state.hits = 0; state.startedAt = 0; $('log').textContent = ''; update(); };
$('btnAll').onclick = () => {
  state.store = {}; state.tested = state.store[state.id] || (state.store[state.id] = new Map());
  state.down.clear();   // 不清的话，按住跨过清零的键会把冲突峰值污染成旧值
  state.hits = 0; state.peak = 0; state.unknown = new Map(); state.startedAt = 0;
  $('log').textContent = ''; update();
};

setLayout('104');
</script>
</body>
